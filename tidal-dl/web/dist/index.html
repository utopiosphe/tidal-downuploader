<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIDAL 分布式下载系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <script src="https://unpkg.com/naive-ui@2.38.1/dist/index.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        #app { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, #111118 0%, #0d0d14 100%);
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 20px 0;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        .logo {
            padding: 10px 24px 30px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .logo span { font-size: 11px; font-weight: 400; opacity: 0.5; display: block; margin-top: 2px; -webkit-text-fill-color: #888; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 24px; cursor: pointer;
            color: #888; font-size: 14px; font-weight: 500;
            transition: all 0.2s; border-left: 3px solid transparent;
            text-decoration: none;
        }
        .nav-item:hover { color: #c0c0c0; background: rgba(255,255,255,0.03); }
        .nav-item.active {
            color: #a78bfa; background: rgba(139,92,246,0.08);
            border-left-color: #8b5cf6;
        }
        .nav-icon { font-size: 18px; width: 22px; text-align: center; }
        .main { margin-left: 220px; flex: 1; padding: 32px; min-height: 100vh; }
        .page-title {
            font-size: 26px; font-weight: 700; margin-bottom: 24px;
            color: #f0f0f0; letter-spacing: -0.5px;
        }
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 28px;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 20px;
            transition: all 0.3s;
        }
        .stat-card:hover { border-color: rgba(139,92,246,0.3); transform: translateY(-2px); }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; color: #f0f0f0; }
        .stat-value.purple { color: #a78bfa; }
        .stat-value.green { color: #4ade80; }
        .stat-value.yellow { color: #fbbf24; }
        .stat-value.red { color: #f87171; }
        .stat-value.blue { color: #60a5fa; }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 24px; margin-bottom: 20px;
        }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #d0d0d0; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            text-align: left; padding: 12px 16px; color: #888;
            font-weight: 600; font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        td {
            padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04);
            color: #c0c0c0;
        }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 600; text-transform: uppercase;
        }
        .badge-pending { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .badge-running, .badge-downloading, .badge-assigned { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .badge-completed { background: rgba(74,222,128,0.15); color: #4ade80; }
        .badge-failed, .badge-dead { background: rgba(248,113,113,0.15); color: #f87171; }
        .badge-active, .badge-online { background: rgba(74,222,128,0.15); color: #4ade80; }
        .badge-paused { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .badge-uploading { background: rgba(168,85,247,0.15); color: #a855f7; }
        .badge-offline, .badge-error, .badge-banned { background: rgba(248,113,113,0.15); color: #f87171; }
        .badge-token_expired, .badge-refresh_failed { background: rgba(251,146,60,0.15); color: #fb923c; }
        .btn {
            padding: 8px 18px; border-radius: 8px; border: none;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-danger { background: rgba(248,113,113,0.15); color: #f87171; }
        .btn-success { background: rgba(74,222,128,0.15); color: #4ade80; }
        .btn-warning { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 13px; color: #888; margin-bottom: 6px; display: block; font-weight: 500; }
        .form-input {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04); color: #e0e0e0;
            font-size: 14px; font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: #8b5cf6; }
        textarea.form-input { min-height: 80px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .progress-bar {
            height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.5s ease;
        }
        .pagination { display: flex; align-items: center; gap: 8px; margin-top: 16px; justify-content: center; }
        .pagination button {
            padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
            background: transparent; color: #888; cursor: pointer; font-size: 13px;
        }
        .pagination button:hover { border-color: #8b5cf6; color: #a78bfa; }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pagination span { color: #888; font-size: 13px; }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .filter-bar select {
            padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04); color: #e0e0e0; font-size: 13px;
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: #1a1a24; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 28px; min-width: 480px; max-width: 600px;
            max-height: 80vh; overflow-y: auto;
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #f0f0f0; }
        .empty { text-align: center; padding: 40px; color: #666; font-size: 14px; }
        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            padding: 14px 20px; border-radius: 10px; font-size: 14px;
            background: rgba(74,222,128,0.15); color: #4ade80;
            border: 1px solid rgba(74,222,128,0.3);
            animation: slideIn 0.3s ease;
        }
        .toast-error { background: rgba(248,113,113,0.15); color: #f87171; border-color: rgba(248,113,113,0.3); }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .file-upload {
            border: 2px dashed rgba(255,255,255,0.1); border-radius: 12px;
            padding: 30px; text-align: center; cursor: pointer;
            transition: all 0.3s;
        }
        .file-upload:hover { border-color: rgba(139,92,246,0.4); background: rgba(139,92,246,0.05); }
        .file-upload input { display: none; }
        .recent-list { list-style: none; }
        .recent-item {
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px;
        }
        .recent-item:last-child { border-bottom: none; }
        .text-muted { color: #666; font-size: 12px; }
        .spinner {
            width: 20px; height: 20px; border: 2px solid rgba(139,92,246,0.2);
            border-top-color: #8b5cf6; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="app">
    <!-- Toast -->
    <div v-if="toast.show" :class="['toast', toast.type === 'error' ? 'toast-error' : '']">
        {{ toast.message }}
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            TIDAL-DL
            <span>分布式下载系统</span>
        </div>
        <router-link to="/" class="nav-item" :class="{active: $route.path === '/'}">
            <span class="nav-icon">📊</span> Dashboard
        </router-link>
        <router-link to="/jobs" class="nav-item" :class="{active: $route.path.startsWith('/jobs')}">
            <span class="nav-icon">📦</span> 批次管理
        </router-link>
        <router-link to="/tasks" class="nav-item" :class="{active: $route.path === '/tasks'}">
            <span class="nav-icon">🎵</span> 任务列表
        </router-link>
        <router-link to="/accounts" class="nav-item" :class="{active: $route.path === '/accounts'}">
            <span class="nav-icon">🔑</span> 账号管理
        </router-link>
        <router-link to="/workers" class="nav-item" :class="{active: $route.path === '/workers'}">
            <span class="nav-icon">⚙️</span> Worker 节点
        </router-link>
        <router-link to="/config" class="nav-item" :class="{active: $route.path === '/config'}">
            <span class="nav-icon">⚡</span> 全局配置
        </router-link>
    </div>

    <!-- Main -->
    <div class="main">
        <router-view></router-view>
    </div>
</div>

<script>
const { createApp, ref, reactive, onMounted, computed, watch, onUnmounted } = Vue;
const { createRouter, createWebHashHistory } = VueRouter;

const API = '/api';

// === 通用 ===
async function api(path, options = {}) {
    const resp = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options,
    });
    if (!resp.ok) throw new Error(await resp.text());
    return resp.json();
}

function fmtBytes(b) {
    if (!b) return '0 B';
    if (b < 1024) return b + ' B';
    if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
    if (b < 1024*1024*1024) return (b/1024/1024).toFixed(1) + ' MB';
    if (b < 1024*1024*1024*1024) return (b/1024/1024/1024).toFixed(2) + ' GB';
    if (b < 1024*1024*1024*1024*1024) return (b/1024/1024/1024/1024).toFixed(2) + ' TB';
    return (b/1024/1024/1024/1024/1024).toFixed(2) + ' PB';
}

function fmtTime(t) {
    if (!t) return '-';
    return new Date(t).toLocaleString('zh-CN', { hour12: false });
}

function fmtDuration(s) {
    if (!s) return '-';
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2, '0')}`;
}

// === Dashboard ===
const Dashboard = {
    template: `
    <div>
        <div class="page-title">Dashboard</div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">总任务</div>
                <div class="stat-value purple">{{ d.tasks?.total?.toLocaleString() || 0 }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">待处理</div>
                <div class="stat-value yellow">{{ d.tasks?.pending?.toLocaleString() || 0 }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">下载中</div>
                <div class="stat-value blue">{{ d.tasks?.active || 0 }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">已完成</div>
                <div class="stat-value green">{{ d.tasks?.completed?.toLocaleString() || 0 }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">失败</div>
                <div class="stat-value red">{{ d.tasks?.failed || 0 }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总下载量</div>
                <div class="stat-value">{{ fmtBytes(d.total_bytes) }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Worker 在线</div>
                <div class="stat-value green">{{ d.workers?.online || 0 }} <span style="font-size:14px;color:#888">/ {{ d.workers?.total || 0 }}</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">账号</div>
                <div class="stat-value">{{ totalAccounts }}</div>
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
            <div class="card">
                <div class="card-title">✅ 最近完成</div>
                <ul class="recent-list" v-if="d.recent_completed?.length">
                    <li class="recent-item" v-for="t in d.recent_completed" :key="t.id">
                        <div>
                            <div style="color:#e0e0e0">{{ t.title }}</div>
                            <div class="text-muted">{{ t.artist }} · {{ fmtBytes(t.file_size) }}</div>
                        </div>
                        <div class="text-muted">{{ fmtTime(t.completed_at) }}</div>
                    </li>
                </ul>
                <div v-else class="empty">暂无</div>
            </div>
            <div class="card">
                <div class="card-title">❌ 最近失败</div>
                <ul class="recent-list" v-if="d.recent_failed?.length">
                    <li class="recent-item" v-for="t in d.recent_failed" :key="t.id">
                        <div>
                            <div style="color:#e0e0e0">{{ t.title }}</div>
                            <div class="text-muted">{{ t.error_code }} - {{ t.error_message?.substring(0,50) }}</div>
                        </div>
                        <div class="text-muted">{{ fmtTime(t.updated_at) }}</div>
                    </li>
                </ul>
                <div v-else class="empty">暂无</div>
            </div>
        </div>
    </div>`,
    setup() {
        const d = ref({});
        let timer;
        const load = async () => { try { d.value = await api('/dashboard'); } catch(e) {} };
        const totalAccounts = computed(() => {
            const a = d.value.accounts || {};
            return Object.values(a).reduce((s, v) => s + v, 0);
        });
        onMounted(() => { load(); timer = setInterval(load, 15000); });
        onUnmounted(() => clearInterval(timer));
        return { d, fmtBytes, fmtTime, totalAccounts };
    }
};

// === Jobs ===
const Jobs = {
    template: `
    <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
            <div class="page-title" style="margin-bottom:0">批次管理</div>
            <button class="btn btn-primary" @click="showImport = true">📁 导入 JSON</button>
        </div>

        <div class="card" v-for="job in jobs" :key="job.id">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <div>
                    <span style="font-size:16px;font-weight:600;color:#f0f0f0">{{ job.name }}</span>
                    <span :class="'badge badge-' + job.status" style="margin-left:10px">{{ job.status }}</span>
                </div>
                <div style="display:flex;gap:8px">
                    <button class="btn btn-sm" style="background:rgba(124,58,237,0.15);color:#a78bfa" @click="openTrend(job.id, job.name)" v-if="job.completed > 0">📈 趋势</button>
                    <button class="btn btn-sm" style="background:rgba(74,222,128,0.15);color:#4ade80" @click="loadExportGroups(job.id, job.name)" v-if="job.completed > 0">📥 导出</button>
                    <button class="btn btn-sm btn-warning" @click="retryFailed(job.id)" v-if="job.failed > 0">🔄 重试失败</button>
                    <button class="btn btn-sm btn-danger" @click="pauseJob(job.id)" v-if="job.status === 'running'">⏸ 暂停</button>
                    <button class="btn btn-sm btn-success" @click="resumeJob(job.id)" v-if="job.status === 'paused'">▶ 恢复</button>
                </div>
            </div>
            <div style="display:flex;gap:24px;font-size:13px;color:#888;margin-bottom:12px">
                <span>总数: <b style="color:#e0e0e0">{{ job.total_tracks?.toLocaleString() }}</b></span>
                <span>完成: <b style="color:#4ade80">{{ job.completed?.toLocaleString() }}</b></span>
                <span>失败: <b style="color:#f87171">{{ job.failed }}</b></span>
                <span>进行中: <b style="color:#60a5fa">{{ job.active_count || 0 }}</b></span>
                <span v-if="job.total_bytes">已下载: <b style="color:#a78bfa">{{ fmtBytes(job.total_bytes) }}</b></span>
                <span>创建: {{ fmtTime(job.created_at) }}</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" :style="{width: (job.total_tracks ? (job.completed/job.total_tracks*100) : 0) + '%'}"></div>
            </div>
            <div style="text-align:right;font-size:12px;color:#666;margin-top:4px">
                {{ job.total_tracks ? (job.completed/job.total_tracks*100).toFixed(1) : 0 }}%
            </div>
        </div>
        <div v-if="!jobs.length" class="card empty">暂无批次，点击右上角导入 JSON</div>

        <!-- Import Modal -->
        <div class="modal-overlay" v-if="showImport" @click.self="showImport = false">
            <div class="modal">
                <div class="modal-title">📁 导入 JSON 任务文件</div>
                <div class="form-group">
                    <label class="form-label">批次名称</label>
                    <input class="form-input" v-model="importName" placeholder="如: 客户A-2026-06-09">
                </div>
                <div class="form-group">
                    <div class="file-upload" @click="$refs.fileInput.click()" @drop.prevent="onDrop" @dragover.prevent>
                        <input ref="fileInput" type="file" accept=".json,.csv" @change="onFileSelect">
                        <div style="font-size:28px;margin-bottom:8px">📄</div>
                        <div v-if="importFile" style="color:#a78bfa">{{ importFile.name }} ({{ fmtBytes(importFile.size) }})</div>
                        <div v-else style="color:#888">点击选择或拖拽 JSON / CSV 文件</div>
                    </div>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end">
                    <button class="btn" style="background:rgba(255,255,255,0.06);color:#888" @click="showImport = false">取消</button>
                    <button class="btn btn-primary" @click="doImport" :disabled="!importFile || importing">
                        {{ importing ? '导入中...' : '开始导入' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- Export Modal -->
        <div class="modal-overlay" v-if="showExport" @click.self="showExport = false">
            <div class="modal" style="max-width:920px;width:90vw">
                <div class="modal-title" style="display:flex;justify-content:space-between;align-items:center">
                    <span>📥 导出已完成任务 - {{ exportJobName }}</span>
                    <button class="btn btn-sm" style="background:rgba(167,139,250,0.15);color:#a78bfa;font-size:12px" @click="refreshExportGroups" :disabled="exportRefreshing">
                        {{ exportRefreshing ? '刷新中...' : '🔄 刷新分组' }}
                    </button>
                </div>
                <div v-if="exportLoading" style="text-align:center;padding:20px;color:#888">加载中...</div>
                <div v-else-if="exportGroups.length === 0" style="text-align:center;padding:20px;color:#888">暂无分组数据，请点击"刷新分组"生成</div>
                <div v-else>
                    <div style="margin-bottom:10px;color:#888;font-size:13px">共 {{ exportTotal.toLocaleString() }} 条已完成，总大小 <b style="color:#a78bfa">{{ fmtBytes(exportTotalSize) }}</b>，每 50,000 条一组</div>
                    <div style="display:flex;align-items:center;padding:4px 10px;font-size:11px;color:#555;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:2px">
                        <span style="width:180px">分组</span>
                        <span style="width:190px">时间范围</span>
                        <span style="width:70px;text-align:right">大小</span>
                        <span style="width:70px;text-align:right">数量</span>
                        <span style="flex:1;text-align:center">S3 状态</span>
                        <span style="width:130px;text-align:right">操作</span>
                    </div>
                    <div style="max-height:560px;overflow-y:auto">
                        <div v-for="g in exportGroups" :key="g.id" 
                             style="display:flex;align-items:center;padding:6px 10px;margin-bottom:1px;background:rgba(255,255,255,0.02);border-radius:4px;font-size:12px"
                             :style="g.group_index % 2 === 0 ? 'background:rgba(255,255,255,0.03)' : ''">
                            <div style="width:180px">
                                <span style="color:#e0e0e0;font-weight:500">第 {{ g.group_index + 1 }} 组</span>
                                <span style="color:#555;font-size:10px;margin-left:2px">({{ (g.group_index * 50000 + 1).toLocaleString() }}-{{ (g.group_index * 50000 + g.task_count).toLocaleString() }})</span>
                            </div>
                            <div style="width:190px;font-size:10px;color:#666">{{ (g.time_range_start || '').slice(5,16) }} ~ {{ (g.time_range_end || '').slice(5,16) }}</div>
                            <div style="width:70px;text-align:right;color:#4ade80;font-weight:600;font-size:11px">{{ fmtBytes(g.total_size) }}</div>
                            <div style="width:70px;text-align:right;color:#888;font-size:11px">{{ g.task_count.toLocaleString() }}</div>
                            <div style="flex:1;text-align:center">
                                <span v-if="g.s3_cleanup_status === 'none'" style="font-size:10px;color:#555;background:rgba(255,255,255,0.04);padding:1px 6px;border-radius:3px">未清理</span>
                                <span v-else-if="g.s3_cleanup_status === 'pending'" style="font-size:10px;color:#eab308;background:rgba(234,179,8,0.1);padding:1px 6px;border-radius:3px">等待中</span>
                                <span v-else-if="g.s3_cleanup_status === 'running'" style="font-size:10px;color:#60a5fa;background:rgba(96,165,250,0.1);padding:1px 6px;border-radius:3px">🔄 {{ g.s3_cleaned_count }}/{{ g.task_count }}</span>
                                <span v-else-if="g.s3_cleanup_status === 'completed'" style="font-size:10px;color:#4ade80;background:rgba(74,222,128,0.1);padding:1px 6px;border-radius:3px">✅ 已清理</span>
                                <span v-else-if="g.s3_cleanup_status === 'failed'" style="font-size:10px;color:#f87171;background:rgba(248,113,113,0.1);padding:1px 6px;border-radius:3px">❌ 失败</span>
                            </div>
                            <div style="width:130px;display:flex;gap:4px;justify-content:flex-end">
                                <button class="btn btn-sm btn-primary" @click="downloadGroup(g.group_index)" style="font-size:10px;padding:2px 7px">⬇ CSV</button>
                                <button class="btn btn-sm" style="background:rgba(248,113,113,0.15);color:#f87171;font-size:10px;padding:2px 7px" 
                                        @click="confirmCleanup(g)" :disabled="g.s3_cleanup_status === 'running' || g.s3_cleanup_status === 'pending'"
                                        v-if="g.s3_cleanup_status !== 'completed'">🗑️ 清理</button>
                                <button class="btn btn-sm" style="background:rgba(248,113,113,0.15);color:#f87171;font-size:10px;padding:2px 7px" 
                                        @click="confirmCleanup(g)" v-if="g.s3_cleanup_status === 'failed'">🔄</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div style="display:flex;justify-content:flex-end;margin-top:16px">
                    <button class="btn" style="background:rgba(255,255,255,0.06);color:#888" @click="showExport = false">关闭</button>
                </div>
            </div>
        </div>

        <!-- Cleanup Confirm Modal -->
        <div class="modal-overlay" v-if="showCleanupConfirm" @click.self="showCleanupConfirm = false">
            <div class="modal" style="max-width:420px">
                <div class="modal-title" style="color:#f87171">⚠️ 确认清理 S3 资源</div>
                <div style="color:#ccc;font-size:14px;line-height:1.8;margin:12px 0">
                    将永久删除 <b style="color:#f87171">第 {{ cleanupTarget?.group_index + 1 }} 组</b> 的 
                    <b style="color:#f87171">{{ cleanupTarget?.task_count?.toLocaleString() }}</b> 个 S3 文件（共 {{ fmtBytes(cleanupTarget?.total_size) }}）。
                    <br><br>此操作<b style="color:#f87171">不可撤销</b>，请确认。
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
                    <button class="btn" style="background:rgba(255,255,255,0.06);color:#888" @click="showCleanupConfirm = false">取消</button>
                    <button class="btn" style="background:rgba(248,113,113,0.2);color:#f87171" @click="doCleanup">确认删除</button>
                </div>
            </div>
        </div>

        <!-- Trend Modal -->
        <div class="modal-overlay" v-if="showTrend" @click.self="closeTrend">
            <div class="modal" style="max-width:1100px;width:92vw">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                    <div class="modal-title" style="margin-bottom:0">📈 {{ trendJobName }} - 趋势</div>
                    <button class="btn btn-sm" style="background:rgba(255,255,255,0.06);color:#888;font-size:18px;padding:4px 10px" @click="closeTrend">✕</button>
                </div>
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
                    <span style="color:#94a3b8;font-size:13px">时间范围:</span>
                    <button v-for="h in [6, 24, 72, 168]" :key="h"
                            class="btn btn-sm" @click="trendHours = h; fetchTrend()"
                            :style="trendHours === h ? 'background:rgba(139,92,246,0.25);color:#a78bfa' : 'background:rgba(255,255,255,0.06);color:#888'">
                        {{ h <= 24 ? h + 'h' : (h/24) + '天' }}
                    </button>
                    <input type="number" v-model.number="trendHours" min="1" max="720" style="width:60px;background:rgba(255,255,255,0.06);color:#e0e0e0;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:4px 8px;font-size:13px;text-align:center" @keyup.enter="fetchTrend()">
                    <span style="color:#94a3b8;font-size:13px">小时</span>
                    <button class="btn btn-sm" style="background:rgba(37,99,235,0.2);color:#60a5fa" @click="fetchTrend()">确认</button>
                    <span v-if="trendLoading" style="color:#888;font-size:12px">加载中...</span>
                    <span v-else-if="trendCached" style="color:#666;font-size:11px">⚡ 缓存</span>
                </div>
                <div style="position:relative;height:400px">
                    <canvas ref="trendCanvas"></canvas>
                </div>
                <div v-if="!trendLoading && trendData.length === 0" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#666">暂无趋势数据</div>
            </div>
        </div>
    </div>`,
    setup() {
        const jobs = ref([]);
        const showImport = ref(false);
        const importName = ref('');
        const importFile = ref(null);
        const importing = ref(false);

        const showExport = ref(false);
        const exportGroups = ref([]);
        const exportTotal = ref(0);
        const exportTotalSize = ref(0);
        const exportLoading = ref(false);
        const exportJobId = ref(0);
        const exportJobName = ref('');

        // 趋势图
        const showTrend = ref(false);
        const trendJobId = ref(0);
        const trendJobName = ref('');
        const trendHours = ref(24);
        const trendLoading = ref(false);
        const trendCached = ref(false);
        const trendData = ref([]);
        const trendCanvas = ref(null);
        let trendChart = null;

        const load = async () => { try { jobs.value = await api('/jobs'); } catch(e) {} };

        // 趋势图
        const autoUnit = (bytes) => {
            if (bytes >= 1024**4) return { div: 1024**4, unit: 'TB' };
            if (bytes >= 1024**3) return { div: 1024**3, unit: 'GB' };
            if (bytes >= 1024**2) return { div: 1024**2, unit: 'MB' };
            if (bytes >= 1024)    return { div: 1024,    unit: 'KB' };
            return { div: 1, unit: 'B' };
        };

        const openTrend = (jobId, jobName) => {
            trendJobId.value = jobId;
            trendJobName.value = jobName || 'Job ' + jobId;
            trendHours.value = 24;
            showTrend.value = true;
            Vue.nextTick(() => fetchTrend());
        };

        const closeTrend = () => {
            showTrend.value = false;
            if (trendChart) { trendChart.destroy(); trendChart = null; }
        };

        const fetchTrend = async () => {
            trendLoading.value = true;
            try {
                const data = await api('/tasks/trend?job_id=' + trendJobId.value + '&hours=' + trendHours.value);
                trendData.value = data.buckets || [];
                trendCached.value = !!data.cached;
                Vue.nextTick(() => renderTrend());
            } catch(e) {
                showToast('加载趋势失败: ' + e.message, 'error');
            }
            trendLoading.value = false;
        };

        const renderTrend = () => {
            if (!trendCanvas.value || trendData.value.length === 0) return;
            if (trendChart) trendChart.destroy();

            const labels = trendData.value.map(d => {
                // 简化时间标签：只显示 HH:MM 或 MM-DD HH:MM
                const t = d.time;
                return t.length > 11 ? t.slice(5) : t;
            });
            const completed = trendData.value.map(d => d.completed);
            const failed = trendData.value.map(d => d.failed);
            const cumCompleted = trendData.value.map(d => d.cum_completed);
            const sizeRaw = trendData.value.map(d => d.size);
            const cumSizeRaw = trendData.value.map(d => d.cum_size);

            // 自动选择大小单位
            const sUnit = autoUnit(Math.max(...sizeRaw.filter(v => v > 0), 1));
            const csUnit = autoUnit(Math.max(...cumSizeRaw.filter(v => v > 0), 1));
            const sizeScaled = sizeRaw.map(v => +(v / sUnit.div).toFixed(2));

            const ctx = trendCanvas.value.getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: '完成数 (增量)',
                            data: completed,
                            borderColor: '#4ade80',
                            backgroundColor: 'rgba(74,222,128,0.1)',
                            yAxisID: 'yIncr',
                            tension: 0.3,
                            pointRadius: 2,
                            fill: true,
                            order: 2
                        },
                        {
                            label: '失败数 (增量)',
                            data: failed,
                            borderColor: '#f87171',
                            backgroundColor: 'rgba(248,113,113,0.3)',
                            yAxisID: 'yIncr',
                            tension: 0.3,
                            pointRadius: 2,
                            fill: true,
                            order: 1
                        },
                        {
                            label: '数据量 (' + sUnit.unit + ')',
                            data: sizeScaled,
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56,189,248,0.08)',
                            yAxisID: 'yIncr',
                            tension: 0.3,
                            pointRadius: 1,
                            fill: true,
                            order: 3
                        },
                        {
                            label: '累计完成',
                            data: cumCompleted,
                            borderColor: '#facc15',
                            borderDash: [6, 3],
                            yAxisID: 'yCum',
                            tension: 0.3,
                            pointRadius: 0,
                            order: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#e2e8f0', font: { size: 12 } } },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            borderColor: '#334155',
                            borderWidth: 1,
                            callbacks: {
                                afterBody: (items) => {
                                    const idx = items[0]?.dataIndex;
                                    if (idx !== undefined) {
                                        const d = trendData.value[idx];
                                        const cs = autoUnit(d.cum_size);
                                        return '累计数据量: ' + (d.cum_size / cs.div).toFixed(2) + ' ' + cs.unit;
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#94a3b8', font: { size: 10 }, maxTicksLimit: 15, maxRotation: 0 },
                            grid: { color: 'rgba(51,65,85,.4)' }
                        },
                        yIncr: {
                            type: 'linear',
                            position: 'left',
                            title: { display: true, text: '增量', color: '#4ade80' },
                            ticks: { color: '#4ade80' },
                            grid: { color: 'rgba(51,65,85,.3)' },
                            beginAtZero: true
                        },
                        yCum: {
                            type: 'linear',
                            position: 'right',
                            title: { display: true, text: '累计完成', color: '#facc15' },
                            ticks: { color: '#facc15' },
                            grid: { drawOnChartArea: false },
                            beginAtZero: true
                        }
                    }
                }
            });
        };

        const onFileSelect = (e) => { importFile.value = e.target.files[0]; };
        const onDrop = (e) => { importFile.value = e.dataTransfer.files[0]; };

        const doImport = async () => {
            if (!importFile.value) return;
            importing.value = true;
            try {
                const fd = new FormData();
                fd.append('file', importFile.value);
                fd.append('name', importName.value || importFile.value.name);
                fd.append('quality', 'LOSSLESS');
                const isCsv = importFile.value.name.toLowerCase().endsWith('.csv');
                const endpoint = isCsv ? '/jobs/import-csv' : '/jobs/import';
                const resp = await fetch(API + endpoint, { method: 'POST', body: fd });
                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.detail || '导入失败');
                }
                showToast(data.message || '导入成功');
                showImport.value = false;
                importFile.value = null;
                importName.value = '';
                load();
            } catch(e) {
                showToast('导入失败: ' + e.message, 'error');
            }
            importing.value = false;
        };

        const retryFailed = async (id) => { await api('/jobs/' + id + '/retry-failed', { method: 'POST' }); showToast('已重置失败任务'); load(); };
        const pauseJob = async (id) => { await api('/jobs/' + id + '/pause', { method: 'POST' }); showToast('已暂停'); load(); };
        const resumeJob = async (id) => { await api('/jobs/' + id + '/resume', { method: 'POST' }); showToast('已恢复'); load(); };

        const loadExportGroups = async (jobId, jobName) => {
            exportJobId.value = jobId;
            exportJobName.value = jobName || 'Job ' + jobId;
            showExport.value = true;
            exportLoading.value = true;
            try {
                const data = await api('/exports/groups?job_id=' + jobId);
                exportGroups.value = data.groups || [];
                exportTotal.value = data.total || 0;
                exportTotalSize.value = data.total_size || 0;
            } catch(e) {
                showToast('加载分组失败: ' + e.message, 'error');
            }
            exportLoading.value = false;
        };
        const refreshExportGroups = async () => {
            exportRefreshing.value = true;
            try {
                await api('/exports/groups/refresh?job_id=' + exportJobId.value, { method: 'POST' });
                await loadExportGroups(exportJobId.value, exportJobName.value);
                showToast('分组刷新完成');
            } catch(e) {
                showToast('刷新失败: ' + e.message, 'error');
            }
            exportRefreshing.value = false;
        };
        const downloadGroup = (groupIndex) => {
            window.open(API + '/exports/groups/download?job_id=' + exportJobId.value + '&group=' + groupIndex, '_blank');
        };

        // S3 清理
        const showCleanupConfirm = ref(false);
        const cleanupTarget = ref(null);
        const exportRefreshing = ref(false);
        const confirmCleanup = (group) => {
            cleanupTarget.value = group;
            showCleanupConfirm.value = true;
        };
        const doCleanup = async () => {
            showCleanupConfirm.value = false;
            const g = cleanupTarget.value;
            if (!g) return;
            try {
                await api('/exports/groups/' + g.id + '/cleanup', { method: 'POST' });
                showToast('清理任务已启动');
                g.s3_cleanup_status = 'pending';
                // 轮询状态
                pollCleanupStatus(g);
            } catch(e) {
                showToast('清理启动失败: ' + e.message, 'error');
            }
        };
        const pollCleanupStatus = (g) => {
            const iv = setInterval(async () => {
                try {
                    const st = await api('/exports/groups/' + g.id + '/cleanup-status');
                    g.s3_cleanup_status = st.s3_cleanup_status;
                    g.s3_cleaned_count = st.s3_cleaned_count;
                    if (st.s3_cleanup_status === 'completed' || st.s3_cleanup_status === 'failed') {
                        clearInterval(iv);
                        if (st.s3_cleanup_status === 'completed') showToast('✅ S3 清理完成！删除 ' + st.s3_cleaned_count + ' 个文件');
                        else showToast('❌ S3 清理失败', 'error');
                    }
                } catch(e) { clearInterval(iv); }
            }, 3000);
        };

        let timer;
        onMounted(() => { load(); timer = setInterval(load, 15000); });
        onUnmounted(() => clearInterval(timer));
        return { jobs, showImport, showExport, exportGroups, exportTotal, exportTotalSize, exportLoading, exportJobName,
                 showTrend, trendJobName, trendHours, trendLoading, trendCached, trendData, trendCanvas,
                 importName, importFile, importing, onFileSelect, onDrop, doImport, retryFailed, pauseJob, resumeJob,
                 loadExportGroups, downloadGroup, openTrend, closeTrend, fetchTrend, fmtBytes, fmtTime,
                 refreshExportGroups, exportRefreshing, showCleanupConfirm, cleanupTarget, confirmCleanup, doCleanup };
    }
};

// === Tasks ===
const Tasks = {
    template: `
    <div>
        <div class="page-title">任务列表</div>
        <div class="filter-bar">
            <select v-model="filter.status" @change="page=1;load()">
                <option value="">全部状态</option>
                <option value="pending">待处理</option>
                <option value="assigned">已分配</option>
                <option value="downloading">下载中</option>
                <option value="uploading">上传中</option>
                <option value="completed">已完成</option>
                <option value="failed">失败</option>
                <option value="dead">放弃</option>
            </select>
            <select v-model="filter.job_id" @change="page=1;load()">
                <option value="0">全部批次</option>
                <option v-for="j in jobList" :value="j.id">{{ j.name }}</option>
            </select>
            <span class="text-muted">共 {{ total.toLocaleString() }} 条</span>
        </div>

        <div class="card">
            <div class="table-wrapper">
                <table>
                    <thead><tr>
                        <th>ID</th><th>曲目</th><th>艺人</th><th>专辑</th>
                        <th>状态</th><th>Worker</th><th>错误</th><th>大小</th><th>S3</th>
                    </tr></thead>
                    <tbody>
                        <tr v-for="t in tasks" :key="t.id">
                            <td>{{ t.id }}</td>
                            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.title }}</td>
                            <td>{{ t.artist }}</td>
                            <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.album }}</td>
                            <td><span :class="'badge badge-' + t.status">{{ t.status }}</span></td>
                            <td style="font-size:11px;color:#666">{{ t.assigned_worker_id || '-' }}</td>
                            <td style="max-width:150px;font-size:11px;color:#f87171;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.error_message || '' }}</td>
                            <td>{{ t.file_size ? fmtBytes(t.file_size) : '-' }}</td>
                            <td style="font-size:11px;color:#666;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.s3_key || '-' }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div v-if="!tasks.length" class="empty">暂无任务</div>
            <div class="pagination" v-if="total > pageSize">
                <button @click="page--;load()" :disabled="page<=1">上一页</button>
                <span>{{ page }} / {{ Math.ceil(total/pageSize) }}</span>
                <button @click="page++;load()" :disabled="page>=Math.ceil(total/pageSize)">下一页</button>
            </div>
        </div>
    </div>`,
    setup() {
        const tasks = ref([]);
        const total = ref(0);
        const page = ref(1);
        const pageSize = 50;
        const filter = reactive({ status: '', job_id: 0 });
        const jobList = ref([]);

        const load = async () => {
            try {
                let url = '/tasks?page=' + page.value + '&page_size=' + pageSize;
                if (filter.status) url += '&status=' + filter.status;
                if (filter.job_id) url += '&job_id=' + filter.job_id;
                const data = await api(url);
                tasks.value = data.tasks;
                total.value = data.total;
            } catch(e) {}
        };
        const loadJobs = async () => { try { jobList.value = await api('/jobs'); } catch(e) {} };

        let timer;
        onMounted(() => { load(); loadJobs(); timer = setInterval(load, 15000); });
        onUnmounted(() => clearInterval(timer));
        return { tasks, total, page, pageSize, filter, jobList, load, fmtBytes };
    }
};

                <div v-if="deviceStep === 'waiting'">
                    <div style="background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.3);border-radius:12px;padding:24px;margin-bottom:20px">
                        <div style="font-size:13px;color:#888;margin-bottom:8px">请在浏览器中打开以下链接：</div>
                        <a :href="deviceAuth.verify_url" target="_blank"
                           style="color:#a78bfa;font-size:18px;font-weight:600;text-decoration:none;word-break:break-all">
                            {{ deviceAuth.verify_url }}
                        </a>
                        <div style="margin-top:16px">
                            <button class="btn btn-primary" @click="copyUrl"
                                    style="padding:10px 24px">📋 复制链接</button>
                        </div>
                    </div>

                    <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:16px">
                        <div class="spinner"></div>
                        <span style="color:#888;font-size:14px">等待您在浏览器中登录并授权... ({{ countdown }}s)</span>
                    </div>

                    <div style="font-size:12px;color:#555">
                        步骤：打开链接 → 输入 TIDAL 账号密码 → 点击授权 → 自动完成
                    </div>
                </div>

                <div v-if="deviceStep === 'success'" style="padding:20px">
                    <div style="font-size:48px;margin-bottom:12px">🎉</div>
                    <div style="font-size:18px;font-weight:600;color:#4ade80;margin-bottom:8px">授权成功！</div>
                    <div style="color:#888">账号已自动添加到系统</div>
                </div>

                <div v-if="deviceStep === 'error'" style="padding:20px">
                    <div style="font-size:48px;margin-bottom:12px">❌</div>
                    <div style="font-size:16px;color:#f87171;margin-bottom:8px">授权失败</div>
                    <div style="color:#888">{{ deviceAuth.error }}</div>
                    <button class="btn btn-primary" style="margin-top:16px" @click="startDeviceAuth">重试</button>
                </div>

                <div style="margin-top:20px" v-if="deviceStep !== 'loading'">
                    <button class="btn" style="background:rgba(255,255,255,0.06);color:#888" @click="cancelDevice">关闭</button>
                </div>
            </div>
        </div>

        <!-- Manual Token Modal -->
        <div class="modal-overlay" v-if="showManual" @click.self="showManual = false">
            <div class="modal" style="max-width:600px">
                <div class="modal-title">📋 手动导入 Token</div>

                <!-- 模式切换 -->
                <div style="display:flex;gap:8px;margin-bottom:16px">
                    <button class="btn btn-sm" :style="importMode === 'json' ? 'background:rgba(139,92,246,0.2);color:#a78bfa' : 'background:rgba(255,255,255,0.06);color:#888'"
                            @click="importMode = 'json'">📄 粘贴 JSON</button>
                    <button class="btn btn-sm" :style="importMode === 'manual' ? 'background:rgba(139,92,246,0.2);color:#a78bfa' : 'background:rgba(255,255,255,0.06);color:#888'"
                            @click="importMode = 'manual'">✏️ 手动填写</button>
                </div>

                <!-- JSON 粘贴模式 -->
                <div v-if="importMode === 'json'">
                    <div style="font-size:12px;color:#888;margin-bottom:12px">
                        粘贴 TIDAL OAuth 响应的完整 JSON（包含 access_token / refresh_token / user 等字段）
                    </div>
                    <div class="form-group">
                        <label class="form-label">OAuth Client ID <span style="color:#888">(如 49YxDN9a2aFV6RTG)</span></label>
                        <input class="form-input" v-model="importToken.oauth_client_id" placeholder="49YxDN9a2aFV6RTG" style="font-family:monospace;font-size:12px" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">JSON 响应 <span style="color:#f87171">*</span></label>
                        <textarea class="form-input" v-model="jsonInput" rows="8" placeholder='粘贴完整 JSON，例如：
{
    "access_token": "eyJraWQi...",
    "refresh_token": "eyJraWQi...",
    "user": {
        "email": "xxx@xxx.com",
        "userId": 208571779,
        "countryCode": "US"
    }
}' style="font-family:monospace;font-size:11px" @input="parseJsonInput"></textarea>
                    </div>

                    <!-- 解析结果预览 -->
                    <div v-if="parsedPreview" style="background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.15);border-radius:8px;padding:12px;margin-bottom:16px;font-size:12px">
                        <div style="color:#4ade80;font-weight:600;margin-bottom:8px">✅ 解析成功</div>
                        <div style="display:grid;grid-template-columns:100px 1fr;gap:4px 8px;color:#ccc">
                            <span style="color:#888">邮箱:</span><span>{{ parsedPreview.email || '-' }}</span>
                            <span style="color:#888">User ID:</span><span>{{ parsedPreview.user_id || '-' }}</span>
                            <span style="color:#888">地区:</span><span>{{ parsedPreview.country_code || '-' }}</span>
                            <span style="color:#888">Access Token:</span><span style="font-family:monospace;word-break:break-all">{{ (parsedPreview.access_token || '').slice(0,40) }}...</span>
                            <span style="color:#888">Refresh Token:</span><span>{{ parsedPreview.refresh_token ? '✅ 已获取' : '❌ 无' }}</span>
                            <span style="color:#888">Client ID:</span><span>{{ importToken.oauth_client_id || '-' }}</span>
                        </div>
                    </div>
                    <div v-else-if="jsonInput.trim() && jsonParseError" style="background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.15);border-radius:8px;padding:12px;margin-bottom:16px;font-size:12px;color:#f87171">
                        ❌ {{ jsonParseError }}
                    </div>
                </div>

                <!-- 手动填写模式 -->
                <div v-if="importMode === 'manual'">
                    <div style="font-size:12px;color:#888;margin-bottom:12px">
                        逐字段填写账号信息
                    </div>
                    <div class="form-group">
                        <label class="form-label">Access Token <span style="color:#f87171">*</span></label>
                        <textarea class="form-input" v-model="importToken.access_token" rows="3" placeholder="eyJraWQiOi..." style="font-family:monospace;font-size:11px"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Refresh Token <span style="color:#888">(填写后支持自动续期)</span></label>
                        <textarea class="form-input" v-model="importToken.refresh_token" rows="2" placeholder="eyJraWQiOi..." style="font-family:monospace;font-size:11px"></textarea>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                        <div class="form-group">
                            <label class="form-label">OAuth Client ID</label>
                            <input class="form-input" v-model="importToken.oauth_client_id" placeholder="49YxDN9a2aFV6RTG" style="font-family:monospace;font-size:12px" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">邮箱 <span style="color:#888">(可选)</span></label>
                            <input class="form-input" v-model="importToken.email" placeholder="user@example.com" style="font-size:12px" />
                        </div>
                    </div>
                </div>

                <div style="display:flex;gap:10px;justify-content:flex-end">
                    <button class="btn" style="background:rgba(255,255,255,0.06);color:#888" @click="showManual = false">取消</button>
                    <button class="btn btn-primary" @click="doImportToken"
                            :disabled="importMode === 'json' ? !parsedPreview : !importToken.access_token.trim()">导入</button>
                </div>
            </div>
        </div>
    </div>`,
    setup() {
        const accounts = ref([]);
        const showManual = ref(false);
        const showDevice = ref(false);
        const deviceStep = ref('loading'); // loading | waiting | success | error
        const deviceAuth = ref({});
        const countdown = ref(300);
        let pollTimer = null;
        let countdownTimer = null;

        const form = reactive({
            email: '', user_id: null, country_code: 'NG',
            access_token: '', refresh_token: '',
            subscription_type: 'PREMIUM', highest_quality: 'LOSSLESS',
        });

        const importToken = reactive({ access_token: '', refresh_token: '', oauth_client_id: '', email: '' });
        const importMode = ref('json');
        const jsonInput = ref('');
        const parsedPreview = ref(null);
        const jsonParseError = ref('');

        const load = async () => { try { accounts.value = await api('/accounts'); } catch(e) {} };

        const parseJsonInput = () => {
            parsedPreview.value = null;
            jsonParseError.value = '';
            const raw = jsonInput.value.trim();
            if (!raw) return;
            try {
                // 尝试提取 JSON 部分（跳过 email,password 和 client_id 行）
                const jsonMatch = raw.match(/\{[\s\S]*\}/);
                if (!jsonMatch) { jsonParseError.value = '未找到 JSON 对象'; return; }
                const data = JSON.parse(jsonMatch[0]);
                if (!data.access_token) { jsonParseError.value = '缺少 access_token 字段'; return; }
                const user = data.user || {};
                parsedPreview.value = {
                    access_token: data.access_token,
                    refresh_token: data.refresh_token || '',
                    email: user.email || user.username || '',
                    user_id: data.user_id || user.userId || '',
                    country_code: user.countryCode || '',
                };
                // 尝试从非JSON部分提取 client_id
                const preJson = raw.slice(0, raw.indexOf('{'));
                const cidMatch = preJson.match(/client_id[：:]\s*(\S+)/i);
                if (cidMatch && !importToken.oauth_client_id) {
                    importToken.oauth_client_id = cidMatch[1].trim();
                }
            } catch(e) {
                jsonParseError.value = 'JSON 解析失败: ' + e.message;
            }
        };

        // === 设备码授权 ===
        const startDeviceAuth = async () => {
            showDevice.value = true;
            deviceStep.value = 'loading';
            deviceAuth.value = {};
            try {
                const data = await api('/auth/device-code', { method: 'POST' });
                deviceAuth.value = data;
                deviceStep.value = 'waiting';
                countdown.value = data.expires_in || 300;

                // 倒计时
                countdownTimer = setInterval(() => {
                    countdown.value--;
                    if (countdown.value <= 0) { cancelDevice(); }
                }, 1000);

                // 轮询授权状态
                pollTimer = setInterval(async () => {
                    try {
                        const status = await api('/auth/device-code/' + data.session_id);
                        if (status.status === 'completed') {
                            deviceStep.value = 'success';
                            clearInterval(pollTimer);
                            clearInterval(countdownTimer);
                            load();
                            setTimeout(() => { showDevice.value = false; }, 2000);
                        } else if (status.status === 'error' || status.status === 'expired') {
                            deviceStep.value = 'error';
                            deviceAuth.value.error = status.error || '授权超时';
                            clearInterval(pollTimer);
                            clearInterval(countdownTimer);
                        }
                    } catch(e) {}
                }, 3000);

            } catch(e) {
                deviceStep.value = 'error';
                deviceAuth.value.error = e.message;
            }
        };

        const cancelDevice = () => {
            showDevice.value = false;
            clearInterval(pollTimer);
            clearInterval(countdownTimer);
        };

        const copyUrl = () => {
            navigator.clipboard.writeText(deviceAuth.value.verify_url);
            showToast('链接已复制');
        };

        // === 手动添加 ===
        const addAccount = async () => {
            try {
                await api('/accounts', { method: 'POST', body: JSON.stringify(form) });
                showToast('账号添加成功');
                showManual.value = false;
                Object.assign(form, { email: '', user_id: null, access_token: '', refresh_token: '' });
                load();
            } catch(e) { showToast('添加失败: ' + e.message, 'error'); }
        };

        // === 手动导入 Token ===
        const doImportToken = async () => {
            try {
                let body;
                if (importMode.value === 'json' && parsedPreview.value) {
                    body = {
                        access_token: parsedPreview.value.access_token,
                        refresh_token: parsedPreview.value.refresh_token,
                        oauth_client_id: importToken.oauth_client_id || undefined,
                        email: parsedPreview.value.email || undefined,
                    };
                } else {
                    body = {
                        access_token: importToken.access_token,
                        refresh_token: importToken.refresh_token,
                        oauth_client_id: importToken.oauth_client_id || undefined,
                        email: importToken.email || undefined,
                    };
                }
                const data = await api('/accounts/import-token', {
                    method: 'POST',
                    body: JSON.stringify(body)
                });
                showToast(`导入成功！user_id=${data.user_id}, 地区=${data.country_code}, 过期=${data.expires_at}`);
                showManual.value = false;
                Object.assign(importToken, { access_token: '', refresh_token: '', oauth_client_id: '', email: '' });
                jsonInput.value = '';
                parsedPreview.value = null;
                jsonParseError.value = '';
                load();
            } catch(e) { showToast('导入失败: ' + e.message, 'error'); }
        };

        // === Token 刷新 ===
        const refreshToken = async (id) => {
            try {
                const data = await api('/auth/refresh/' + id, { method: 'POST' });
                showToast(data.message + ' (过期: ' + data.expires_at + ')');
                load();
            } catch(e) { showToast('刷新失败: ' + e.message, 'error'); }
        };

        const delAccount = async (id) => {
            if (!confirm('确认删除?')) return;
            await api('/accounts/' + id, { method: 'DELETE' });
            showToast('已删除'); load();
        };

        onMounted(load);
        onUnmounted(() => { clearInterval(pollTimer); clearInterval(countdownTimer); });
        return { accounts, showManual, showDevice, deviceStep, deviceAuth, countdown,
                 form, importToken, importMode, jsonInput, parsedPreview, jsonParseError,
                 startDeviceAuth, cancelDevice, copyUrl, addAccount, doImportToken, parseJsonInput, refreshToken, delAccount, fmtTime, load };
    }
};

const Workers = {
    template: `
    <div>
        <div class="page-title">Worker 节点</div>
        <div class="card">
            <div class="table-wrapper">
                <table>
                    <thead><tr>
                        <th>ID</th><th>名称</th><th>IP</th><th>状态</th>
                        <th>并发</th><th>活跃任务</th><th>已下载</th><th>失败</th><th>总大小</th><th>最后心跳</th><th>操作</th>
                    </tr></thead>
                    <tbody>
                        <tr v-for="w in workers" :key="w.id">
                            <td style="font-size:11px;font-family:monospace">{{ w.id }}</td>
                            <td>{{ w.name }}</td>
                            <td>{{ w.ip }}</td>
                            <td><span :class="'badge badge-' + (isOnline(w) ? 'online' : 'offline')">{{ isOnline(w) ? 'online' : 'offline' }}</span></td>
                            <td>
                                <span @click="editConcurrency(w)" style="cursor:pointer;text-decoration:underline dotted;color:#a78bfa" title="点击修改">{{ w.max_concurrency }}</span>
                            </td>
                            <td>{{ w.active_tasks }}</td>
                            <td style="color:#4ade80">{{ w.total_downloaded }}</td>
                            <td style="color:#f87171">{{ w.total_failed }}</td>
                            <td>{{ fmtBytes(w.total_bytes) }}</td>
                            <td style="font-size:12px;color:#888">{{ fmtTime(w.last_heartbeat) }}</td>
                            <td>
                                <button class="btn btn-sm btn-danger" @click="delWorker(w.id)">删除</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div v-if="!workers.length" class="empty">暂无 Worker 注册<br><br><span style="font-size:12px;color:#666">启动 Worker: python main.py --server http://117.55.199.29:8000</span></div>
        </div>

        <!-- Edit Modal -->
        <div class="modal-overlay" v-if="showEdit" @click.self="showEdit = false">
            <div class="modal" style="min-width:380px">
                <div class="modal-title">⚙️ 修改 Worker 配置</div>
                <div style="font-size:12px;color:#666;margin-bottom:16px;font-family:monospace">{{ editWorker.id }}</div>
                <div class="form-group">
                    <label class="form-label">名称</label>
                    <input class="form-input" v-model="editWorker.name">
                </div>
                <div class="form-group">
                    <label class="form-label">最大并发数</label>
                    <input class="form-input" v-model.number="editWorker.max_concurrency" type="number" min="1" max="200">
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end">
                    <button class="btn" style="background:rgba(255,255,255,0.06);color:#888" @click="showEdit = false">取消</button>
                    <button class="btn btn-primary" @click="saveWorker">保存</button>
                </div>
            </div>
        </div>
    </div>`,
    setup() {
        const workers = ref([]);
        const showEdit = ref(false);
        const editWorker = reactive({ id: '', name: '', max_concurrency: 10 });

        const load = async () => { try { workers.value = await api('/workers'); } catch(e) {} };
        const isOnline = (w) => {
            if (!w.last_heartbeat) return false;
            const hb = w.last_heartbeat.endsWith('Z') ? w.last_heartbeat : w.last_heartbeat + 'Z';
            return (Date.now() - new Date(hb).getTime()) < 90000;
        };

        const editConcurrency = (w) => {
            Object.assign(editWorker, { id: w.id, name: w.name, max_concurrency: w.max_concurrency });
            showEdit.value = true;
        };

        const saveWorker = async () => {
            try {
                await api('/workers/' + editWorker.id, {
                    method: 'PUT',
                    body: JSON.stringify({ name: editWorker.name, max_concurrency: editWorker.max_concurrency })
                });
                showToast('Worker 配置已更新');
                showEdit.value = false;
                load();
            } catch(e) { showToast('更新失败: ' + e.message, 'error'); }
        };

        const delWorker = async (id) => {
            if (!confirm('确认删除此 Worker?')) return;
            await api('/workers/' + id, { method: 'DELETE' });
            showToast('已删除'); load();
        };

        let timer;
        onMounted(() => { load(); timer = setInterval(load, 15000); });
        onUnmounted(() => clearInterval(timer));
        return { workers, showEdit, editWorker, isOnline, editConcurrency, saveWorker, delWorker, fmtBytes, fmtTime };
    }
};

                        <input class="form-input" v-model="s.access_key" style="font-size:12px">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Secret Key</label>
                        <input class="form-input" v-model="s.secret_key" type="password" style="font-size:12px">
                    </div>
                    <div class="form-group">
                        <label class="form-label">下载域名</label>
                        <input class="form-input" v-model="s.download_domain" placeholder="https://example.com" style="font-size:12px">
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">⚡ 下载配置</div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">音质</label>
                    <select class="form-input" v-model="cfg.download.quality">
                        <option value="HI_RES_LOSSLESS">HI_RES_LOSSLESS (最高无损)</option>
                        <option value="LOSSLESS">LOSSLESS (CD无损)</option>
                        <option value="HIGH">HIGH (AAC 320kbps)</option>
                        <option value="LOW">LOW (AAC 96kbps)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">并发数</label>
                    <input class="form-input" v-model.number="cfg.download.concurrency" type="number">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">最大重试</label>
                    <input class="form-input" v-model.number="cfg.download.max_retries" type="number">
                </div>
                <div class="form-group">
                    <label class="form-label">重试延迟 (秒)</label>
                    <input class="form-input" v-model.number="cfg.download.retry_delay" type="number">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">限速等待 (秒)</label>
                    <input class="form-input" v-model.number="cfg.download.rate_limit_delay" type="number">
                </div>
                <div class="form-group">
                    <label class="form-label">任务超时 (秒)</label>
                    <input class="form-input" v-model.number="cfg.download.task_timeout" type="number">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Country Code</label>
                <input class="form-input" v-model="cfg.download.country_code" style="width:100px">
            </div>
        </div>

        <button class="btn btn-primary" style="padding:12px 32px;font-size:15px" @click="save" :disabled="saving">
            {{ saving ? '保存中...' : '💾 保存配置' }}
        </button>
    </div>`,
    setup() {
        const cfg = reactive({
            proxy: { host: '', socks5_port: 41003, http_port: 41002, username: '', password: '', protocol: 'socks5' },
            s3: [],
            download: { quality: 'LOSSLESS', concurrency: 10, max_retries: 3, retry_delay: 5, rate_limit_delay: 30, task_timeout: 300, country_code: 'NG' },
        });
        const saving = ref(false);
        const storageStats = ref({});

        const load = async () => {
            try {
                const data = await api('/config');
                if (data.proxy) Object.assign(cfg.proxy, data.proxy);
                if (data.s3) {
                    // 兼容旧 dict 格式
                    cfg.s3 = Array.isArray(data.s3) ? data.s3 : [data.s3];
                    // 确保每项有默认字段
                    cfg.s3.forEach(s => {
                        s.id = s.id || 'default';
                        s.name = s.name || '';
                        s.provider = s.provider || 'aws';
                        s.enabled = s.enabled !== false;
                        s.download_domain = s.download_domain || '';
                    });
                }
                if (data.download) Object.assign(cfg.download, data.download);
            } catch(e) {}
            // 加载存储统计
            try {
                const stats = await api('/exports/storage-stats');
                storageStats.value = stats;
            } catch(e) {}
        };

        const addStorage = () => {
            cfg.s3.push({
                id: 'storage-' + (cfg.s3.length + 1),
                name: '新存储',
                provider: 'aws',
                enabled: true,
                endpoint: '',
                access_key: '',
                secret_key: '',
                bucket: '',
                region: '',
                prefix: 'tidal-flac/',
                download_domain: ''
            });
        };

        const save = async () => {
            saving.value = true;
            try {
                await api('/config', { method: 'PUT', body: JSON.stringify(cfg) });
                showToast('配置保存成功');
            } catch(e) { showToast('保存失败: ' + e.message, 'error'); }
            saving.value = false;
        };

        onMounted(load);
        return { cfg, saving, save, addStorage, storageStats, fmtBytes };
    }
};

// === Toast ===
let toastTimer;
const toastState = reactive({ show: false, message: '', type: 'success' });
function showToast(msg, type = 'success') {
    toastState.message = msg;
    toastState.type = type;
    toastState.show = true;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastState.show = false; }, 3000);
}

// === Router ===
const routes = [
    { path: '/', component: Dashboard },
    { path: '/jobs', component: Jobs },
    { path: '/tasks', component: Tasks },
    { path: '/accounts', component: Accounts },
    { path: '/workers', component: Workers },
    { path: '/config', component: Config },
];
const router = createRouter({ history: createWebHashHistory(), routes });

// === App ===
const app = createApp({
    setup() { return { toast: toastState }; }
});
app.use(router);
app.mount('#app');
</script>
</body>
</html>
